[agent]
  interval = "5s"
  debug = true
  quiet = false
# ------------------------------------------------------------------------------
# INPUT: Subscribe to Mosquitto MQTT Topic
# ------------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "home/irrigation/telemetry/#"
  ]
  data_format = "json"
  name_override = "plant_telemetry"
  
  # Treat status as an indexed string tag
  tag_keys = ["status"]
  
  # Treat plant_id and moisture_raw as numeric fields
  json_string_fields = []

# Convert plant_id field into a string tag so you can filter plants easily in Grafana
[[processors.converter]]
  [processors.converter.fields]
    tag = ["plant_id"]

# ------------------------------------------------------------------------------
# OUTPUT: Write metrics to InfluxDB v2
# ------------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  # Changed from 127.0.0.1 to influxdb
  urls = ["http://influxdb:8086"]
  
  # Added the actual token defined in docker-compose file
  token = "8ZROcYWL7RdPfQmTl5UcPvKwr1Vkb0mkV3-V1nJzcjAlxYYr7jbJ6UVcjktPUCs37eZkYbsvWRSXQEsIXyzFOQ=="
  organization = "irrigation"
  bucket = "irrigation_metrics"
  
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"